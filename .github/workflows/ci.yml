name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chromium
          - os: macos-latest
            browser: webkit
          - os: windows-latest
            browser: chromium
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
        shell: bash
      - uses: actions/cache@v4
        id: playwright-browsers
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      - if: steps.playwright-browsers.outputs.cache-hit != 'true'
        run: npx playwright install ${{ matrix.browser }}
      - if: runner.os == 'Linux'
        run: npx playwright install-deps ${{ matrix.browser }}
      - run: bash scripts/ci-failure-tail.sh npx playwright test --project=${{ matrix.browser }} --no-deps
        shell: bash
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ matrix.os }}-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  os:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 24
          - os: ubuntu-latest
            node: 26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: bash scripts/ci-failure-tail.sh npx vitest run
        shell: bash
      - run: bash scripts/ci-failure-tail.sh npm run test:package
        shell: bash
      - name: Verify systemd unit with systemd-analyze
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: bash scripts/ci-failure-tail.sh systemd-analyze verify --user "$(npx tsx scripts/verify-systemd-unit.ts)"

  lowest-node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: bash scripts/ci-failure-tail.sh npx vitest run --project node
        shell: bash
      - run: bash scripts/ci-failure-tail.sh npm run test:package
        shell: bash
