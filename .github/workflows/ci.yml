name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  os:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 26
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: bash scripts/ci-failure-tail.sh npx vitest run
        shell: bash
      - run: bash scripts/ci-failure-tail.sh npm run test:package
        shell: bash
      - name: Verify systemd unit with systemd-analyze
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: bash scripts/ci-failure-tail.sh systemd-analyze verify --user "$(npx tsx scripts/verify-systemd-unit.ts)"

  lowest-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: bash scripts/ci-failure-tail.sh npm run test:package
        shell: bash
