name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: bash scripts/ci-failure-tail.sh npx vitest run
        shell: bash
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  os:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash scripts/ci-failure-tail.sh npx vitest run
        shell: bash
      - run: bash scripts/ci-failure-tail.sh npm run test:package
        shell: bash
      - name: Verify systemd unit with systemd-analyze
        if: matrix.os == 'ubuntu-latest'
        run: systemd-analyze verify --user "$(npx tsx scripts/verify-systemd-unit.ts)"
